function ico(name, size=22){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[name]||PATHS.target}</svg>`}
function tile(name,tone='aqua',small=false){return `<span class="icon-tile ${tone==='aqua'?'':tone}${small?' small':''}">${ico(name,small?20:24)}</span>`}
const now=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const thisMonth=()=>now().slice(0,7);
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const amt=n=>Number.isFinite(Number(n))?Number(n):0;
const humanDate=s=>new Date(Number(s.slice(0,4)),Number(s.slice(5,7))-1,Number(s.slice(8,10))).toLocaleDateString('es-PE',{day:'numeric',month:'short'});
const monthLabel=m=>new Date(Number(m.slice(0,4)),Number(m.slice(5,7))-1,1).toLocaleDateString('es-PE',{month:'long',year:'numeric'});
const caps=s=>s.charAt(0).toUpperCase()+s.slice(1);
const nameOf=a=>({digital:'Digital',cash:'Efectivo',savings:'Ahorros'})[a]||'Cuenta';
const typeName=t=>({income:'Ingreso',expense:'Gasto',save:'Aporte a ahorro',withdraw:'Retiro de ahorro',transfer:'Transferencia'})[t]||'Movimiento';
const blank=()=>({schema:2,profile:{name:'',currency:'PEN'},opening:{digital:0,cash:0,savings:0},categories:structuredClone(CATS),transactions:[],goals:[],budgets:{},recurring:[],demo:false});
function load(){try{const a=JSON.parse(localStorage.getItem(KEY));if(a?.schema!==2||!Array.isArray(a.transactions)||!Array.isArray(a.goals))return blank();const b=blank();return {...b,...a,profile:{...b.profile,...a.profile},opening:{...b.opening,...a.opening},categories:{...b.categories,...a.categories}}}catch{return blank()}}
let db=load();let page='home';let goalTab='goals';let month=thisMonth();let filter='all';let searchOpen=false;let searchText='';let showBalance=true;let focusReturn=null;
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{alert('No se pudo guardar. Revisa el espacio disponible del navegador.');return false}}
function money(n){try{return new Intl.NumberFormat('es-PE',{style:'currency',currency:db.profile.currency||'PEN',minimumFractionDigits:2,maximumFractionDigits:2}).format(round(amt(n)))}catch{return `S/ ${round(amt(n)).toFixed(2)}`}}
function maybeMoney(n){return showBalance?money(n):'••••••'}
function changed(t,w){const a=amt(t.amount);switch(t.type){case'income':return t.to===w?a:0;case'expense':return t.from===w?-a:0;case'save':return w==='savings'?a:t.from===w?-a:0;case'withdraw':return w==='savings'?-a:t.to===w?a:0;case'transfer':return (t.to===w?a:0)-(t.from===w?a:0);default:return 0}}
function balances(m=month){const b={...db.opening};const end=m+'-31';for(const t of db.transactions){if(t.date>end)continue;for(const k of ['digital','cash','savings'])b[k]=round(amt(b[k])+changed(t,k))}return b}
function movements(m=month){return db.transactions.filter(t=>t.date?.slice(0,7)===m)}
function monthly(m=month){let income=0,expense=0,saved=0;for(const t of movements(m)){if(t.type==='income')income+=amt(t.amount);if(t.type==='expense')expense+=amt(t.amount);if(t.type==='save')saved+=amt(t.amount);if(t.type==='withdraw')saved-=amt(t.amount)}return {income:round(income),expense:round(expense),saved:round(saved)}}
function goalAmount(id){return round(db.transactions.reduce((total,t)=>t.goalId===id?total+(t.type==='save'?amt(t.amount):t.type==='withdraw'?-amt(t.amount):0):total,0))}
function categorySpent(cat,m=month){return round(movements(m).filter(t=>t.type==='expense'&&t.category===cat).reduce((s,t)=>s+amt(t.amount),0))}
function budgetFor(cat,m=month){return amt(db.budgets[m]?.[cat]||0)}
function sorted(arr){return [...arr].sort((a,b)=>b.date.localeCompare(a.date)||String(b.created||'').localeCompare(String(a.created||'')))}
function monthShift(delta){let [y,m]=month.split('-').map(Number);let d=new Date(y,m-1+delta,1);month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()}
function toast(msg){const n=$('notice');n.textContent=msg;n.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.classList.remove('visible'),3100)}
function emptyState(title,sub,kind='wallet'){return `<div class="empty-state">${tile(kind,'blue')}<strong>${esc(title)}</strong><span>${esc(sub)}</span></div>`}
function selectMonth(){return `<div class="month-controls"><button type="button" class="arrow-month" data-action="month-prev" aria-label="Mes anterior">${ico('back',17)}</button><label class="month-pill">${ico('calendar',18)}<input type="month" id="month-select" value="${month}" aria-label="Mes seleccionado"></label><button type="button" class="arrow-month" data-action="month-next" aria-label="Mes siguiente">${ico('chevron',17)}</button></div>`}
function entryIcon(t){if(t.type==='expense'&&/HBO|Netflix|Prime Video/i.test(t.description))return ['screen','coral'];if(t.type==='expense'&&/music|spotify/i.test(t.description))return ['music','coral'];if(t.type==='expense'&&/baile|gimnasio|fitness/i.test(t.description))return ['dumbbell','coral'];if(t.type==='save')return ['pig','aqua'];if(t.type==='withdraw')return ['coins','amber'];if(t.type==='transfer')return ['transfer','blue'];if(t.type==='income')return ['briefcase','aqua'];const c=t.category||'';if(/subscrip|servicios/i.test(c))return ['receipt','coral'];if(/aliment|comida/i.test(c))return ['cart','coral'];if(/transporte/i.test(c))return ['car','coral'];if(/entreten/i.test(c))return ['music','coral'];if(/educaci/i.test(c))return ['book','blue'];if(/salud/i.test(c))return ['dumbbell','coral'];if(/casa/i.test(c))return ['home','coral'];if(/viajes/i.test(c))return ['plane','coral'];return ['card','coral']}
function entry(t,dated=true){const [ic,tone]=entryIcon(t);const [dd,mm]=[t.date.slice(8),caps(new Date(Number(t.date.slice(0,4)),Number(t.date.slice(5,7))-1,1).toLocaleDateString('es-PE',{month:'short'})).replace('.','')];const sign=t.type==='income'?'+':t.type==='expense'||t.type==='save'?'-':t.type==='withdraw'?'+':'';return `<button type="button" class="entry-row" data-action="edit-transaction" data-id="${esc(t.id)}" aria-label="Editar ${esc(t.description)}"><div class="date-flag">${dated?`${dd}<span>${mm}</span>`:''}</div>${tile(ic,tone,true)}<div class="entry-content"><div class="item-title">${esc(t.description||typeName(t.type))}</div><div class="item-note">${esc(typeName(t.type))}${t.category?' · '+esc(t.category):''}</div></div><div class="amount ${t.type==='expense'?'expense':t.type==='income'?'income':'other'}">${sign}${money(t.amount)}</div></button>`}
function footerText(){return '<p class="footer-info">Prototipo local · No conectado a bancos · Sin cuentas de usuario todavía</p>'}
function welcome(){if(db.transactions.length||db.recurring.length||db.goals.length||db.demo)return '';return `<div class="intro-note"><strong>¡Bienvenido a Saldo Claro!</strong><br>Registra tus datos desde cero o carga un ejemplo ficticio para explorar todas las pantallas.<br><button type="button" data-action="demo">Probar con datos de ejemplo ${ico('chevron',14)}</button></div>`}
function renderHome(){const b=balances(),m=monthly(),available=round(b.digital+b.cash),recent=sorted(movements()).slice(0,4);const name=db.profile.name.trim().split(' ')[0]||'';const base=maybeMoney(available);const metrics=[['income','Ingresos',m.income,'Registrados este mes','aqua'],['expense','Egresos',m.expense,'Registrados este mes','coral'],['pig','Ahorro',m.saved,'Apartado este mes','aqua'],['target','Metas',db.goals.length,db.goals.length===1?'1 meta en progreso':`${db.goals.length} metas creadas`,'blue']];return `<section class="page"><h1 class="hello">¡Hola${name?', '+esc(name):''}!</h1><p class="subtitle">Aquí tienes tu resumen financiero.</p>${selectMonth()}${welcome()}
 <div class="hero"><div class="hero-top"><span>Saldo disponible</span><button type="button" class="eye-button" data-action="toggle-balance" aria-label="${showBalance?'Ocultar':'Mostrar'} importes">${ico(showBalance?'eye':'eyeoff')}</button></div><strong class="hero-val ${showBalance?'':'hidden-balance'}">${base}</strong><p class="hero-sub">Dinero digital + efectivo. Tus ahorros están separados.</p></div>
 <div class="metric-grid">${metrics.map(([ic,label,value,foot,tone])=>`<div class="metric"><div class="metric-top">${tile(ic,tone)}<span>${label}</span></div><div class="metric-value">${ic==='target'?value:maybeMoney(value)}</div><div class="metric-foot">${foot}</div></div>`).join('')}</div>
 ${Object.entries(b).filter(([,v])=>v<0).length?`<div class="balance-notice">Hay un bolsillo con saldo negativo. Revisa tus movimientos o tus saldos iniciales.</div>`:''}
 <div class="quick-row"><button type="button" class="quick-button primary" data-action="add-transaction" data-type="expense">${ico('plus',18)} Registrar gasto</button><button type="button" class="quick-button" data-action="add-transaction" data-type="income">${ico('plus',18)} Añadir ingreso</button></div>
 <div class="section-h"><h2>Tus cuentas</h2><button type="button" class="text-link" data-action="navigate" data-page="settings">Ajustar ${ico('chevron',16)}</button></div><div class="panel">${[['digital','card','Yape / Plin / Banca','blue'],['cash','cash','En billetera','aqua'],['savings','pig','Dinero separado','amber']].map(([k,ic,sub,tone])=>`<div class="wallet-row">${tile(ic,tone)}<div class="wallet-detail"><div class="item-title">${nameOf(k)}</div><div class="item-note">${sub}</div></div><div class="amount-strong ${b[k]<0?'value-negative':''}">${maybeMoney(b[k])}</div></div>`).join('')}</div>
 <div class="section-h"><h2>Últimos movimientos</h2><button class="text-link" type="button" data-action="navigate" data-page="movements">Ver todos ${ico('chevron',16)}</button></div><div class="entries">${recent.length?recent.map(t=>entry(t)).join(''):emptyState('Aún no hay movimientos','Añade tu primer ingreso o gasto.','list')}</div>
 <div class="section-h"><h2>Planificación</h2><button class="text-link" type="button" data-action="open-plan">Ver plan ${ico('chevron',16)}</button></div><div class="panel"><div class="flexline" style="justify-content:space-between"><span class="item-title">Compromisos previstos</span><span class="amount-strong">${db.recurring.length}</span></div><p class="subtle">Los pagos e ingresos previstos no alteran el saldo hasta que registres el movimiento real.</p><button class="secondary-btn btn-full" type="button" data-action="open-plan">Consultar plan mensual</button></div>${footerText()}</section>`}
function renderMovements(){let arr=movements();if(filter==='savings')arr=arr.filter(t=>t.type==='save'||t.type==='withdraw');else if(filter!=='all')arr=arr.filter(t=>t.type===filter);if(searchText.trim())arr=arr.filter(t=>[t.description,t.category,t.note,nameOf(t.from),nameOf(t.to)].join(' ').toLowerCase().includes(searchText.toLowerCase()));arr=sorted(arr);const opts=[['all','Todos'],['income','Ingresos'],['expense','Gastos'],['savings','Ahorros'],['transfer','Transferencias']];return `<section class="page"><div class="page-heading"><div><h1>Movimientos</h1><p class="subtitle">Tu actividad financiera en un solo lugar.</p></div><button class="icon-button" type="button" data-action="search" aria-label="Buscar movimientos">${ico('search')}</button></div>${selectMonth()}${searchOpen?`<div class="search-area"><input id="tx-search" type="search" placeholder="Buscar descripción o categoría..." value="${esc(searchText)}" aria-label="Buscar movimientos"></div>`:''}<div class="filter-scroll">${opts.map(([id,label])=>`<button type="button" class="filter-pill ${filter===id?'active':''}" data-action="filter" data-filter="${id}">${label}</button>`).join('')}</div><div class="divider-date">${caps(monthLabel(month))} · ${arr.length} registro${arr.length===1?'':'s'}</div><div class="entries">${arr.length?arr.map(t=>entry(t)).join(''):emptyState('Sin movimientos para mostrar','Puedes crear un movimiento con el botón inferior.','receipt')}</div><button class="floating-add" type="button" data-action="add-transaction" data-type="expense">${ico('plus',19)} Añadir movimiento</button>${footerText()}</section>`}
function renderGoals(){const sum=balances().savings;return `<section class="page"><div class="page-heading"><div><h1>Metas</h1><p class="subtitle">Ahorra hoy por eso que te importa.</p></div><button type="button" class="icon-button" style="background:var(--teal);color:#fff" data-action="add-goal" aria-label="Nueva meta">${ico('plus')}</button></div><div class="goals-switch"><button type="button" class="${goalTab==='goals'?'active':''}" data-action="goal-tab" data-tab="goals">Mis metas</button><button type="button" class="${goalTab==='plan'?'active':''}" data-action="goal-tab" data-tab="plan">Plan mensual</button></div>${goalTab==='plan'?renderPlan():`${db.goals.map(g=>{const saved=goalAmount(g.id),pct=g.target>0?Math.max(0,Math.min(100,saved/g.target*100)):0;const remaining=Math.max(0,g.target-saved);return `<div class="goal-card"><div class="goal-top">${tile(GOAL_ICONS.includes(g.icon)?g.icon:'target','blue')}<div class="goal-info"><div class="goal-title">${esc(g.name)}</div><div class="goal-desc">${esc(g.note||'Tu objetivo personal')}</div></div><button type="button" class="kebab" data-action="goal-options" data-id="${esc(g.id)}" aria-label="Opciones de ${esc(g.name)}">${ico('dots',21)}</button></div><div class="goal-values"><strong>${maybeMoney(saved)}</strong><span>de ${maybeMoney(g.target)}</span></div><div class="progress" role="progressbar" aria-label="Progreso de la meta ${esc(g.name)}" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div><div class="goal-foot"><span>${Math.round(pct)}% completado</span><span>Faltan ${maybeMoney(remaining)}</span></div><div class="goal-actions"><button class="mini-action fill" type="button" data-action="goal-deposit" data-id="${esc(g.id)}">${ico('plus',14)} Aportar</button><button class="mini-action" type="button" data-action="goal-withdraw" data-id="${esc(g.id)}">Retirar</button></div></div>`}).join('')||emptyState('Crea tu primera meta','Ejemplo: una laptop, un viaje o un curso.','target')}<button type="button" class="create-goal" data-action="add-goal">${ico('plus',20)} Nueva meta</button><div class="section-h"><h2>Tu ahorro acumulado</h2></div><div class="panel"><div class="flexline">${tile('pig','amber')}<div><div class="item-note">Total reservado</div><div class="amount-strong" style="font-size:21px">${maybeMoney(sum)}</div></div></div><p class="subtle">El ahorro disponible incluye fondos sin asignar a una meta.</p><button type="button" class="secondary-btn btn-full" data-action="goal-tab" data-tab="plan">Ver mi plan de ahorro mensual ${ico('chevron',15)}</button></div>`}${footerText()}</section>`}
function paid(r){return db.transactions.some(t=>t.recurringId===r.id&&t.recurringMonth===month)}
function renderPlan(){const mo=monthly(),planTotal=db.categories.expense.reduce((s,c)=>s+budgetFor(c),0);const yr=month.slice(0,4);const years=Array.from({length:12},(_,i)=>`${yr}-${String(i+1).padStart(2,'0')}`);return `<div class="inline-stats"><div class="inline-stat"><small>Gastos reales del mes</small><strong>${maybeMoney(mo.expense)}</strong></div><div class="inline-stat"><small>Presupuesto de gastos</small><strong>${maybeMoney(planTotal)}</strong></div><div class="inline-stat"><small>Ingresos reales</small><strong>${maybeMoney(mo.income)}</strong></div><div class="inline-stat"><small>Ahorro neto del mes</small><strong>${maybeMoney(mo.saved)}</strong></div></div><div class="section-h"><h2>Presupuesto por categoría</h2><button type="button" class="text-link" data-action="budget">${ico('plus',16)} Editar</button></div><div class="panel">${db.categories.expense.filter(c=>budgetFor(c)>0||categorySpent(c)>0).map(c=>{let p=budgetFor(c),a=categorySpent(c);return `<div class="budget-item"><div><div class="item-title">${esc(c)}</div><small>${p>0&&a>p?'Superaste lo planificado':p===0?'Sin presupuesto establecido':'Previsto / Real'}</small></div><div class="amounts"><strong class="${p>0&&a>p?'value-negative':''}">${maybeMoney(a)}</strong>de ${maybeMoney(p)}</div></div>`}).join('')||emptyState('Sin presupuestos todavía','Agrega importes para controlar gastos futuros.','coins')}</div><button class="secondary-btn btn-full" style="margin-top:10px" data-action="budget" type="button">${ico('plus',16)} Añadir presupuesto</button><div class="section-h"><h2>Pagos e ingresos previstos</h2><button class="text-link" type="button" data-action="add-recurring">${ico('plus',16)} Añadir</button></div><div class="panel">${[...db.recurring].sort((a,b)=>a.day-b.day).map(r=>`<div class="budget-item"><div><div class="item-title">${esc(r.title)}</div><small>Día ${r.day===31?'último':r.day} · ${r.type==='income'?'Ingreso':'Pago'} previsto · ${esc(nameOf(r.account))}</small></div><div class="amounts"><strong>${maybeMoney(r.amount)}</strong><div class="compact-option"><button type="button" class="text-link" data-action="edit-recurring" data-id="${esc(r.id)}">Editar</button><button type="button" class="text-link" data-action="record-recurring" data-id="${esc(r.id)}" ${paid(r)?'disabled':''}>${paid(r)?'Registrado':'Registrar'}</button></div></div></div>`).join('')||emptyState('Sin pagos previstos','Añade una suscripción, un sueldo o un compromiso mensual.','calendar')}</div><p class="subtle">Los importes previstos NO se contabilizan como recibidos ni pagados automáticamente.</p><div class="section-h"><h2>Vista anual ${yr}</h2></div><div class="panel"><div class="year-row head"><span>Mes</span><span>Ingresos</span><span>Egresos</span></div>${years.map(m=>{const d=monthly(m);return `<div class="year-row"><span>${caps(monthLabel(m).split(' ')[0])}</span><span>${maybeMoney(d.income)}</span><span>${maybeMoney(d.expense)}</span></div>`}).join('')}</div>`}
function renderSettings(){const b=db.opening;return `<section class="page"><div class="page-heading"><div><h1>Ajustes</h1><p class="subtitle">Personaliza tu experiencia y tus cuentas.</p></div>${tile('settings','blue')}</div><div class="private-note">${ico('lock',18)} <strong>Esta es una maqueta local.</strong> No tiene inicio de sesión ni aislamiento entre usuarios del mismo navegador. Evita registrar datos financieros sensibles en equipos compartidos.</div><div class="section-h"><h2>Mi perfil y saldos iniciales</h2></div><div class="panel"><form id="profile-form"><div class="form-group"><label for="setting-name">Tu nombre</label><input id="setting-name" name="name" maxlength="55" placeholder="¿Cómo te llamas?" value="${esc(db.profile.name)}"></div><div class="form-group"><label for="setting-currency">Moneda</label><select name="currency" id="setting-currency"><option value="PEN" ${db.profile.currency==='PEN'?'selected':''}>Soles (PEN)</option><option value="USD" ${db.profile.currency==='USD'?'selected':''}>Dólares (USD)</option><option value="EUR" ${db.profile.currency==='EUR'?'selected':''}>Euros (EUR)</option></select><small class="field-hint">Cambiar moneda solo cambia el símbolo; NO convierte los importes.</small></div><div class="form-group"><label>Dinero que tenías al empezar</label><div class="form-grid"><div><label class="field-hint" for="opening-digital">Digital</label><input id="opening-digital" name="digital" type="number" step="0.01" min="0" value="${amt(b.digital)}" inputmode="decimal"></div><div><label class="field-hint" for="opening-cash">Efectivo</label><input id="opening-cash" name="cash" type="number" step="0.01" min="0" value="${amt(b.cash)}" inputmode="decimal"></div></div><div style="margin-top:10px"><label class="field-hint" for="opening-savings">Ahorros no asignados a metas</label><input id="opening-savings" name="savings" type="number" step="0.01" min="0" value="${amt(b.savings)}" inputmode="decimal"></div></div><button type="submit" class="primary-btn btn-full">Guardar cambios</button></form></div><div class="section-h"><h2>Categorías</h2></div><div class="panel"><p class="item-title">Gastos</p><div class="category-chips">${db.categories.expense.map(x=>`<span>${esc(x)}</span>`).join('')}</div><p class="item-title">Ingresos</p><div class="category-chips">${db.categories.income.map(x=>`<span>${esc(x)}</span>`).join('')}</div><form id="category-form"><div class="form-grid"><div class="form-group"><label for="cat-type">Tipo</label><select id="cat-type" name="type"><option value="expense">Gasto</option><option value="income">Ingreso</option></select></div><div class="form-group"><label for="cat-name">Nueva categoría</label><input id="cat-name" name="name" required maxlength="35" placeholder="Por ejemplo: mascotas"></div></div><button type="submit" class="secondary-btn btn-full">${ico('plus',16)} Añadir categoría</button></form></div><div class="section-h"><h2>Tus datos</h2></div><div class="panel"><p class="subtle">Descarga una copia JSON para llevar tu información a otro navegador. El archivo no está cifrado: guárdalo de forma privada.</p><div class="button-row"><button class="secondary-btn" type="button" data-action="export">${ico('download',17)} Exportar</button><button class="secondary-btn" type="button" data-action="import">${ico('upload',17)} Importar</button></div><button class="secondary-btn btn-full" style="margin-top:5px" type="button" data-action="demo">${ico('refresh',17)} Probar con datos ficticios</button><button class="danger-btn btn-full" style="margin-top:10px" type="button" data-action="clear">${ico('trash',17)} Borrar todos mis datos locales</button></div>${footerText()}</section>`}

function modal(title,html){focusReturn=document.activeElement;$('modal-heading').textContent=title;$('modal-content').innerHTML=html;$('modal-overlay').hidden=false;document.body.style.overflow='hidden';$('modal-overlay').querySelector('.close-modal').innerHTML=ico('close',19);setTimeout(()=>$('modal-content').querySelector('input:not([type=hidden]),select')?.focus({preventScroll:true}),50)}

function formEnd(label='Guardar'){return `<div class="modal-buttons"><button type="button" class="secondary-btn" data-action="close-modal">Cancelar</button><button type="submit" class="primary-btn">${esc(label)}</button></div>`}
function opt(values,chosen){return values.map(v=>`<option value="${esc(v)}" ${v===chosen?'selected':''}>${esc(v)}</option>`).join('')}

function dateSuggested(){return month<thisMonth()?`${month}-${String(new Date(+month.slice(0,4),+month.slice(5,7),0).getDate()).padStart(2,'0')}`:now()}
function transactionForm(x={}){const t={id:'',type:'expense',date:dateSuggested(),amount:'',description:'',category:'',from:'digital',to:x.type==='transfer'&&!x.to?'cash':'digital',goalId:'',note:'',recurringId:'',recurringMonth:'',...x};modal(t.id?'Editar movimiento':'Nuevo movimiento',`<form id="transaction-form"><input type="hidden" name="id" value="${esc(t.id)}"><input type="hidden" name="recurringId" value="${esc(t.recurringId)}"><input type="hidden" name="recurringMonth" value="${esc(t.recurringMonth)}"><div class="form-grid"><div class="form-group"><label for="tx-type">Tipo de movimiento</label><select id="tx-type" name="type">${Object.keys({income:1,expense:1,save:1,withdraw:1,transfer:1}).map(y=>`<option value="${y}" ${t.type===y?'selected':''}>${typeName(y)}</option>`).join('')}</select></div><div class="form-group"><label for="tx-date">Fecha real</label><input id="tx-date" type="date" name="date" required max="${now()}" value="${esc(t.date)}"></div></div><div class="form-group"><label for="tx-amount">Importe (${esc(db.profile.currency)})</label><input id="tx-amount" type="number" name="amount" min="0.01" step="0.01" inputmode="decimal" required placeholder="0.00" value="${t.amount===''?'':amt(t.amount)}"></div><div class="form-group"><label for="tx-description">Descripción</label><input id="tx-description" name="description" maxlength="110" required placeholder="Por ejemplo: almuerzo" value="${esc(t.description)}"></div><div class="form-group" id="wrap-category"><label for="tx-category">Categoría</label><select id="tx-category" name="category" data-initial="${esc(t.category)}"></select></div><div class="form-group"><label id="account-label" for="tx-account">Bolsillo</label><select id="tx-account" name="account" data-from="${esc(t.from)}" data-to="${esc(t.to)}"></select></div><div class="form-group" id="wrap-destination"><label for="tx-destination">Bolsillo de destino</label><select id="tx-destination" name="destination"></select></div><div class="form-group" id="wrap-goal"><label for="tx-goal">Meta de ahorro (opcional)</label><select id="tx-goal" name="goalId"><option value="">Sin asignar a una meta</option>${db.goals.map(g=>`<option value="${esc(g.id)}" ${t.goalId===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div><div class="form-group"><label for="tx-note">Nota (opcional)</label><textarea id="tx-note" name="note" maxlength="250" placeholder="Información adicional">${esc(t.note)}</textarea></div><p class="info-line" id="tx-hint"></p>${formEnd(t.id?'Guardar cambios':'Registrar movimiento')}${t.id?`<button type="button" class="danger-btn btn-full" style="margin-top:8px" data-action="delete-transaction" data-id="${esc(t.id)}">${ico('trash',16)} Eliminar movimiento</button>`:''}</form>`);adjustTxForm()}
function adjustTxForm(){const f=$('transaction-form');if(!f)return;const t=f.elements.type.value;const category=t==='income'||t==='expense';$('wrap-category').hidden=!category;$('wrap-destination').hidden=t!=='transfer';$('wrap-goal').hidden=t!=='save'&&t!=='withdraw';const accounts=t==='withdraw'||t==='income'?['digital','cash']:['digital','cash'];const chosen=t==='income'||t==='withdraw'?f.elements.account.dataset.to:f.elements.account.dataset.from;const prev=f.elements.account.value;f.elements.account.innerHTML=accountOptions(accounts.includes(prev)?prev:accounts.includes(chosen)?chosen:'digital');f.elements.destination.innerHTML=accountOptions(f.elements.destination.value||f.elements.account.dataset.to||'cash');$('account-label').textContent=t==='income'||t==='withdraw'?'Bolsillo que recibe el dinero':'Bolsillo del que sale el dinero';if(category){const cats=db.categories[t];f.elements.category.innerHTML=opt(cats,cats.includes(f.elements.category.value)?f.elements.category.value:cats.includes(f.elements.category.dataset.initial)?f.elements.category.dataset.initial:cats[0])}const hints={income:'Se añade al bolsillo elegido y cuenta como ingreso real.',expense:'Se descuenta del bolsillo y cuenta como gasto real.',save:'Se mueve a Ahorros: no cuenta como gasto.',withdraw:'Regresa dinero de Ahorros a tu bolsillo.',transfer:'Mueve dinero entre Digital y Efectivo, sin aumentar tus ingresos.'};$('tx-hint').textContent=hints[t]}
function goalForm(x={}){const g={id:'',name:'',target:'',note:'',icon:'target',deadline:'',...x};modal(g.id?'Editar meta':'Nueva meta de ahorro',`<form id="goal-form"><input type="hidden" name="id" value="${esc(g.id)}"><div class="form-group"><label for="goal-name">¿Para qué estás ahorrando?</label><input id="goal-name" name="name" maxlength="60" required placeholder="Por ejemplo: Laptop" value="${esc(g.name)}"></div><div class="form-group"><label for="goal-target">¿Cuánto necesitas?</label><input id="goal-target" type="number" name="target" min="0.01" step="0.01" required placeholder="3000.00" value="${g.target===''?'':amt(g.target)}"></div><div class="form-grid"><div class="form-group"><label for="goal-icon">Ícono</label><select id="goal-icon" name="icon">${GOAL_ICONS.map(i=>`<option value="${i}" ${g.icon===i?'selected':''}>${({laptop:'Laptop',plane:'Viaje',book:'Estudio',house:'Casa',gift:'Regalo',car:'Vehículo',target:'Otro objetivo',shield:'Seguridad'})[i]}</option>`).join('')}</select></div><div class="form-group"><label for="goal-date">Fecha opcional</label><input id="goal-date" type="date" name="deadline" value="${esc(g.deadline)}"></div></div><div class="form-group"><label for="goal-note">Descripción breve</label><input id="goal-note" name="note" maxlength="95" placeholder="Para mis estudios y trabajo" value="${esc(g.note)}"></div><p class="info-line">Crear la meta no aparta dinero automáticamente. Usa el botón «Aportar» para registrarlo.</p>${formEnd(g.id?'Guardar cambios':'Crear meta')}${g.id?`<button type="button" class="danger-btn btn-full" data-action="delete-goal" data-id="${esc(g.id)}">${ico('trash',16)} Eliminar meta</button>`:''}</form>`)}
function budgetForm(){const cat=db.categories.expense[0];modal('Presupuesto mensual',`<form id="budget-form"><p class="info-line">Mes: ${caps(monthLabel(month))}. Es dinero <strong>planificado</strong>, no un gasto realizado.</p><div class="form-group"><label for="budget-category">Categoría</label><select id="budget-category" name="category">${opt(db.categories.expense,cat)}</select></div><div class="form-group"><label for="budget-amount">Monto máximo previsto</label><input id="budget-amount" name="amount" type="number" min="0" step="0.01" required value="${budgetFor(cat)}"></div>${formEnd('Guardar presupuesto')}</form>`)}
function recurringForm(x={}){const r={id:'',title:'',type:'expense',amount:'',day:1,category:'Servicios',account:'digital',...x};modal(r.id?'Editar compromiso':'Compromiso mensual',`<form id="recurring-form"><input type="hidden" name="id" value="${esc(r.id)}"><div class="form-group"><label for="rec-title">Concepto</label><input id="rec-title" name="title" required maxlength="80" placeholder="Por ejemplo: Netflix" value="${esc(r.title)}"></div><div class="form-grid"><div class="form-group"><label for="rec-type">Tipo previsto</label><select name="type" id="rec-type"><option value="expense" ${r.type==='expense'?'selected':''}>Pago</option><option value="income" ${r.type==='income'?'selected':''}>Ingreso</option></select></div><div class="form-group"><label for="rec-amount">Monto</label><input id="rec-amount" name="amount" type="number" step="0.01" min="0.01" required value="${r.amount===''?'':amt(r.amount)}"></div></div><div class="form-grid"><div class="form-group"><label for="rec-day">Día del mes</label><select id="rec-day" name="day">${Array.from({length:31},(_,i)=>i+1).map(i=>`<option value="${i}" ${+r.day===i?'selected':''}>${i===31?'Último día':i}</option>`).join('')}</select></div><div class="form-group"><label for="rec-account">Canal previsto</label><select id="rec-account" name="account">${accountOptions(r.account)}</select></div></div><div class="form-group"><label for="rec-category">Categoría</label><select id="rec-category" name="category" data-chosen="${esc(r.category)}"></select></div><p class="info-line">Los compromisos no se cobran ni pagan de forma automática.</p>${formEnd('Guardar compromiso')}${r.id?`<button type="button" class="danger-btn btn-full" data-action="delete-recurring" data-id="${esc(r.id)}">${ico('trash',16)} Eliminar compromiso</button>`:''}</form>`);adjustRecForm()}

function storeTransaction(f){const d=Object.fromEntries(new FormData(f)),amount=round(Number(d.amount)),type=d.type;
 if(!Number.isFinite(amount)||amount<=0)return toast('Introduce un importe mayor que cero.');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||d.date>now()||Number.isNaN(new Date(d.date+'T12:00:00').getTime()))return toast('Selecciona una fecha real que no sea futura.');
 if(!d.description?.trim())return toast('Escribe una descripción.');
 if(type==='transfer'&&d.account===d.destination)return toast('Elige dos bolsillos diferentes para la transferencia.');
 if(type==='withdraw'&&d.goalId){const prev=db.transactions.find(x=>x.id===d.id);const available=goalAmount(d.goalId)+(prev?.goalId===d.goalId&&prev.type==='withdraw'?amt(prev.amount):0);if(amount>available+.001)return toast('La meta no tiene esa cantidad disponible.');}

 const original=db.transactions;db.transactions=d.id?original.map(x=>x.id===d.id?t:x):[...original,t];
 if(db.goals.some(g=>goalAmount(g.id)<-0.001)){db.transactions=original;return toast('El cambio dejaría una meta con ahorro negativo. Revisa sus aportes.')}
 save();closeModal();render();toast(d.id?'Movimiento actualizado':'Movimiento registrado');
}
function storeGoal(f){const d=Object.fromEntries(new FormData(f)),target=round(Number(d.target));if(!d.name.trim()||!Number.isFinite(target)||target<=0)return toast('Revisa el nombre y el objetivo de ahorro.');const g={id:d.id||uid(),name:d.name.trim(),target,note:d.note?.trim()||'',icon:GOAL_ICONS.includes(d.icon)?d.icon:'target',deadline:d.deadline||''};if(d.id)db.goals=db.goals.map(x=>x.id===d.id?g:x);else db.goals.push(g);save();closeModal();render();toast(d.id?'Meta actualizada':'Meta creada')}
function storeBudget(f){const d=Object.fromEntries(new FormData(f)),v=round(Number(d.amount));if(!Number.isFinite(v)||v<0)return toast('El presupuesto no puede ser negativo.');db.budgets[month]??={};db.budgets[month][d.category]=v;save();closeModal();render();toast('Presupuesto guardado')}
function storeRecurring(f){const d=Object.fromEntries(new FormData(f)),v=round(Number(d.amount));if(!d.title?.trim()||!Number.isFinite(v)||v<=0)return toast('Revisa el concepto y el importe.');const r={id:d.id||uid(),title:d.title.trim(),type:d.type,amount:v,day:Number(d.day),category:d.category,account:d.account};if(d.id)db.recurring=db.recurring.map(x=>x.id===d.id?r:x);else db.recurring.push(r);save();closeModal();render();toast('Compromiso previsto guardado')}
function storeProfile(f){const d=Object.fromEntries(new FormData(f));for(const field of ['digital','cash','savings'])if(!Number.isFinite(Number(d[field]))||Number(d[field])<0)return toast('Los saldos iniciales deben ser valores válidos.');if(db.profile.currency!==d.currency&&db.transactions.length&&!confirm('Cambiar moneda NO convertirá los importes de tus movimientos. ¿Continuar?'))return;db.profile.name=d.name?.trim()||'';db.profile.currency=d.currency;for(const x of ['digital','cash','savings'])db.opening[x]=round(Number(d[x]));save();render();toast('Ajustes guardados')}

 // Una meta se fondea con movimientos históricos, no con un porcentaje artificial.
 add(previous+'-05','income',4800,'Ingreso anterior','Sueldo','','digital');add(previous+'-06','save',2400,'Ahorro para laptop','','digital','',g1.id);add(previous+'-07','save',1200,'Ahorro para viaje','','digital','',g2.id);add(previous+'-09','expense',96.30,'Supermercado','Alimentación','digital');add(previous+'-10','transfer',150,'Retiro de efectivo','','digital','cash');

 const d=`${mo}-${String(day).padStart(2,'0')}`;if(d<=now())add(d,type,value,title,cat,from,to,gid,rid,mo)
 }
 b.budgets[mo]={Casa:250,Alimentación:180,Suscripciones:90,Transporte:80,Entretenimiento:180,Educación:150};db=b;save();month=mo;filter='all';searchText='';goalTab='goals';page='home';render();toast('Datos ficticios cargados para la demostración')
}
function exportBackup(){const data=JSON.stringify(db,null,2);const blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`saldo-claro-respaldo-${now()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Respaldo descargado. Guárdalo de forma privada.')}
function importBackup(file){if(!file)return;if(file.size>5_000_000)return toast('El archivo es demasiado grande.');const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(d.schema!==2||!Array.isArray(d.transactions)||!Array.isArray(d.goals)||!Array.isArray(d.recurring)||typeof d.profile!=='object'||typeof d.opening!=='object'||!d.budgets||!d.categories||!Array.isArray(d.categories.expense)||!Array.isArray(d.categories.income))throw new Error('Formato');if(!confirm('Se reemplazarán todos los datos de este navegador por el respaldo seleccionado. ¿Continuar?'))return;db={...blank(),...d,profile:{...blank().profile,...d.profile},opening:{...blank().opening,...d.opening}};save();page='home';render();toast('Respaldo importado')}catch{toast('Archivo incompatible o inválido.')}finally{$('import-file').value=''}};reader.readAsText(file)}
function handleAction(btn){const a=btn.dataset.action,id=btn.dataset.id;
 if(a==='navigate')return navigate(btn.dataset.page);
 if(a==='open-plan'){page='goals';goalTab='plan';render();return window.scrollTo({top:0,behavior:'instant'})}
 if(a==='goal-tab'){goalTab=btn.dataset.tab;render();return}
 if(a==='month-prev')return monthShift(-1);if(a==='month-next')return monthShift(1);
 if(a==='toggle-balance'){showBalance=!showBalance;return render()}
 if(a==='filter'){filter=btn.dataset.filter;return render()}
 if(a==='search'){searchOpen=!searchOpen;if(!searchOpen)searchText='';render();if(searchOpen)$('tx-search')?.focus();return}
 if(a==='add-transaction')return transactionForm({type:btn.dataset.type||'expense'});
 if(a==='edit-transaction'){const t=db.transactions.find(x=>x.id===id);if(t)return transactionForm(t)}
 if(a==='delete-transaction'){const t=db.transactions.find(x=>x.id===id);if(t&&confirm(`¿Eliminar el movimiento «${t.description}» por ${money(t.amount)}?`)){db.transactions=db.transactions.filter(x=>x.id!==id);save();closeModal();render();toast('Movimiento eliminado')}return}
 if(a==='add-goal')return goalForm();if(a==='goal-options'){const g=db.goals.find(x=>x.id===id);if(g)return goalForm(g)}
 if(a==='goal-deposit')return transactionForm({type:'save',goalId:id,description:'Aporte a mi meta'});
 if(a==='goal-withdraw')return transactionForm({type:'withdraw',goalId:id,description:'Retiro de mi meta'});
 if(a==='delete-goal'){if(db.transactions.some(t=>t.goalId===id))return toast('Esta meta tiene aportes asociados. Reasígnalos antes de eliminarla.');if(confirm('¿Eliminar esta meta?')){db.goals=db.goals.filter(g=>g.id!==id);save();closeModal();render();toast('Meta eliminada')}return}
 if(a==='budget')return budgetForm();
 if(a==='add-recurring')return recurringForm();if(a==='edit-recurring'){const r=db.recurring.find(x=>x.id===id);if(r)return recurringForm(r)}
 if(a==='delete-recurring'){if(confirm('¿Eliminar este compromiso? No se borrarán los movimientos que ya registraste.')){db.recurring=db.recurring.filter(r=>r.id!==id);save();closeModal();render();toast('Compromiso eliminado')}return}
 if(a==='record-recurring'){const r=db.recurring.find(x=>x.id===id);if(!r||paid(r))return;if(month>thisMonth())return toast('Todavía no puedes registrar ingresos o gastos futuros.');const [y,m]=month.split('-').map(Number);const due=Math.min(r.day,new Date(y,m,0).getDate());const date=`${month}-${String(due).padStart(2,'0')}`;return transactionForm({type:r.type,amount:r.amount,description:r.title,category:r.category,date:date>now()?now():date,from:r.account,to:r.account,recurringId:r.id,recurringMonth:month})}
 if(a==='close-modal')return closeModal();if(a==='demo')return sample();if(a==='export')return exportBackup();if(a==='import')return $('import-file').click();
 if(a==='clear'){if(confirm('¿BORRAR todos los registros, metas, presupuestos, compromisos y ajustes guardados en este navegador? Esta acción no se puede deshacer.')){db=blank();save();month=thisMonth();page='home';render();toast('Datos locales eliminados')}return}
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(b)return handleAction(b);if(ev.target===$('modal-overlay'))closeModal()});
document.addEventListener('change',ev=>{const id=ev.target.id;if(id==='month-select'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(ev.target.value)){month=ev.target.value;render()}if(id==='tx-type')adjustTxForm();if(id==='rec-type')adjustRecForm();if(id==='budget-category')$('budget-amount').value=budgetFor(ev.target.value);if(id==='import-file')importBackup(ev.target.files?.[0])});
document.addEventListener('input',ev=>{if(ev.target.id==='tx-search'){const cursor=ev.target.selectionStart;searchText=ev.target.value;render();const input=$('tx-search');input?.focus();input?.setSelectionRange(cursor,cursor)}});
document.addEventListener('submit',ev=>{const form=ev.target;const formId=form.getAttribute('id');if(!['transaction-form','goal-form','budget-form','recurring-form','profile-form','category-form'].includes(formId))return;ev.preventDefault();({ 'transaction-form':storeTransaction,'goal-form':storeGoal,'budget-form':storeBudget,'recurring-form':storeRecurring,'profile-form':storeProfile,'category-form':storeCategory})[formId](form)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal-overlay').hidden)closeModal()});
render();

</script>
